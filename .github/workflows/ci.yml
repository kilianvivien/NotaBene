# The standing rules from the implementation plan (§2.1), enforced by a
# machine rather than by memory. The repo is public; a red check on a pull
# request is cheaper than a reviewer noticing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # `pnpm format:check` is deliberately absent: the tree does not currently
      # satisfy it, and reformatting every file is a change worth making on
      # purpose rather than as a side effect of turning CI on.

  rust:
    name: cargo check · cargo test
    # macOS because that is what NotaBene ships on: Tauri's macOS-only paths
    # (the menu bar, the window chrome) would not be compiled anywhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The frontend is not built here — `cargo check` only needs the directory
      # `frontendDist` points at to exist.
      - run: mkdir -p dist && touch dist/index.html

      - run: brew install cmake ninja
      - run: ./scripts/prepare-crispasr-macos.sh

      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      # The wire-shape round trip and the schema-version parity check live
      # here; they are what keep Zod, the serde structs, and the SQL from
      # drifting apart.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
