[project]
name = "notabene-voxtral-worker"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "mlx-audio==0.4.6",
  "msgpack==1.1.1",
  "numpy==2.3.2",
]

[dependency-groups]
dev = [
  "pyinstaller==6.15.0",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
