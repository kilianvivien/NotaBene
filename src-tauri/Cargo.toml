[package]
name = "notabene"
version = "0.7.5"
description = "A simple, privacy-first note-taking app for students"
authors = ["NotaBene contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "notabene_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
serde_bytes = "0.11"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
dirs = "6"
rand = "0.9"
toml_edit = "0.25"
chrono = { version = "0.4", features = ["serde"] }

# The note store. `bundled` compiles SQLite in, so the app never depends on the
# system library version — FTS5 availability in particular is not negotiable.
rusqlite = { version = "0.37", features = ["bundled", "backup"] }

# Embedded MCP server for local agents (loopback Streamable HTTP), same
# lineage as Calqo's.
rmcp = { version = "2.0", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
axum = "0.8"
schemars = "1.0"
tokio = { version = "1", features = [
    "net",
    "sync",
    "time",
    "macros",
    "rt",
    "fs",
    "io-util",
] }
tokio-util = "0.7"
fs2 = "0.4"

# AI provider traffic leaves through Rust rather than the webview's `fetch`, so
# a user-supplied base URL is not also a CSP edit (see plan §E). Same feature
# set the updater plugin already pulls, so this costs no extra compilation.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
regex = "1"
anydoc = "0.1.7"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
crispasr = { version = "=0.8.23", default-features = false, features = ["metal"] }
crispasr-sys = { version = "=0.8.23", default-features = false, features = ["metal"] }
